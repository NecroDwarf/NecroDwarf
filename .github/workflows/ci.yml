name: Website checks
on:
  pull_request:
  push:
    branches: [main, test]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run check
  browser-checks:
    runs-on: ubuntu-latest
    needs: static-site
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: website/build/browser-checks
          if-no-files-found: ignore
